<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NFT Preview Card Component</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="card">
    <div class="image-wrapper">
      <img src="images/image-equilibrium.jpg" alt="NFT artwork" class="nft-image" />
      <img src="images/icon-view.svg" alt="" class="icon-view" />
    </div>

    <h1 class="title">Equilibrium #3429</h1>

    <p class="description">
      Our Equilibrium collection promotes balance and calm.
    </p>

    <div class="info-row">
      <div class="price">
        <img src="images/icon-ethereum.svg" alt="ETH" />
        <span>0.041 ETH</span>
      </div>
      <div class="time">
        <img src="images/icon-clock.svg" alt="" />
        <span>3 days left</span>
      </div>
    </div>

    <hr class="divider" />

    <div class="creator-row">
      <img src="images/image-avatar.png" alt="Creator avatar" class="avatar" />
      <p class="creator"> reation of <span>Jules Wyvern</span>
      </p>
    </div>
  </main>

</body>
</html>
